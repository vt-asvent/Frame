<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Aplica el tema guardado ANTES del primer pintado (sin destello).
      // El oscuro es el valor por defecto histórico de Frame.
      try {
        var t = localStorage.getItem('frameTheme');
        var dark = t === 'light' ? false : t === 'system'
          ? window.matchMedia('(prefers-color-scheme: dark)').matches
          : true;
        document.documentElement.classList.toggle('dark', dark);
        // Color de un mod de apariencia (extensión Animaciones), encima del acento.
        var modCss = localStorage.getItem('frameExt:frame.animaciones:accentCss');
        if (modCss) {
          document.documentElement.setAttribute('data-accent-mod', '1');
          var sm = document.createElement('style');
          sm.id = 'frame-accent-mod';
          sm.textContent = modCss;
          document.head.appendChild(sm);
        }
        // Color de acento (lib/accent.ts): la hoja guardada, ya armada.
        var accentCss = localStorage.getItem('frameAccentCss');
        if (accentCss) {
          document.documentElement.setAttribute('data-accent', localStorage.getItem('frameAccent') || 'marino');
          var st = document.createElement('style');
          st.id = 'frame-accent';
          st.textContent = accentCss;
          document.head.appendChild(st);
        }
      } catch (e) {}
    </script>
    <title>Frame</title>
    <link rel="icon" href="/favicon.ico" />
    <!-- Poppins vendorizada localmente: la app arranca idéntica sin conexión -->
    <link href="/fonts/poppins.css" rel="stylesheet" />
  </head>
  <body class="font-body antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
